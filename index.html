<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍑 TimIDE + TimLearning</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #eee; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #2d2d2d; padding: 10px 20px; display: flex; align-items: center; border-bottom: 2px solid #444; }
        .header h1 { margin: 0; font-size: 22px; color: #ff9f43; margin-right: 20px; }
        .header button { padding: 6px 15px; background: #28a745; border: none; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; margin-left: 10px; }
        .header button:hover { background: #218838; }
        .header .nav-btn { background: #6c757d; padding: 6px 12px; margin: 0 5px; }
        .header .nav-btn:hover { background: #5a6268; }
        
        .container { display: flex; flex: 1; overflow: hidden; }
        
        /* Левая панель - Уроки */
        .sidebar { width: 300px; background: #1e1e1e; border-right: 2px solid #333; overflow-y: auto; padding: 10px; flex-shrink: 0; }
        .sidebar h3 { color: #ff9f43; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .lesson-item { padding: 12px; margin: 5px 0; background: #2d2d2d; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .lesson-item:hover { background: #3a3a3a; }
        .lesson-item.active { background: #ff9f43; color: #121212; font-weight: bold; }
        .lesson-item .desc { font-size: 12px; color: #aaa; margin-top: 4px; display: block; }
        
        /* Правая панель - Редактор */
        .workspace { flex: 1; display: flex; flex-direction: column; padding: 10px; }
        .tabs { display: flex; gap: 15px; margin-bottom: 10px; }
        .tab-btn { background: transparent; border: none; color: #888; padding: 8px; cursor: pointer; font-size: 16px; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #ff9f43; border-bottom: 3px solid #ff9f43; }
        
        .editor-area { flex: 1; display: flex; gap: 10px; }
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; border: 1px solid #444; padding: 10px; font-size: 14px; resize: none; font-family: 'Courier New', monospace; outline: none; border-radius: 6px; }
        .output { flex: 1; background: #1e1e1e; color: #d4d4d4; border: 1px solid #444; padding: 10px; font-size: 14px; overflow-y: auto; white-space: pre-wrap; border-radius: 6px; }
        .error { color: #f14c4c; }
        .success { color: #28a745; }
        
        .lesson-info { background: #2d2d2d; padding: 10px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #ff9f43; }
        .lesson-info h2 { margin: 0 0 10px 0; font-size: 18px; color: #fff; }
        .lesson-info p { margin: 0; color: #ccc; }
        .lesson-info .task { background: #3a3a3a; padding: 8px; border-radius: 4px; margin-top: 8px; color: #f1c40f; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍑 TimLearning</h1>
        <button onclick="runCode()">▶ Запустить</button>
        <button onclick="clearOutput()" style="background: #dc3545;">Очистить</button>
        <div style="flex:1;"></div>
        <button class="nav-btn" onclick="prevLesson()">◀ Назад</button>
        <button class="nav-btn" onclick="nextLesson()">Вперёд ▶</button>
    </div>

    <div class="container">
        <!-- Меню уроков -->
        <div class="sidebar" id="sidebar">
            <h3>📚 Уроки TimLang</h3>
            <div id="lessonList"></div>
        </div>

        <!-- Рабочая область -->
        <div class="workspace">
            <div class="lesson-info" id="lessonInfo">
                <h2>Добро пожаловать!</h2>
                <p>Выберите урок слева, чтобы начать изучение TimLang.</p>
            </div>
            <div class="editor-area">
                <textarea id="codeArea" placeholder="Напишите код на TimLang..."></textarea>
                <div class="output" id="outputArea">⏳ Готов к работе...</div>
            </div>
        </div>
    </div>

    <script>
        // ============================
        // 1. БАЗА ДАННЫХ УРОКОВ
        // ============================
        const lessons = [
            {
                id: 0,
                title: "Введение",
                desc: "Первый запуск",
                theory: "TimLang — это язык программирования с простым синтаксисом. Команда <b>say()</b> выводит текст на экран.",
                code: `say("Привет, мир!")
say("Это мой первый код на TimLang!")`,
                task: "Измени текст в кавычках на своё имя и запусти!"
            },
            {
                id: 1,
                title: "Переменные (set)",
                desc: "Храним данные",
                theory: "Команда <b>set</b> создаёт переменную. Например: <b>set x = 10</b>",
                code: `set имя = "Тим"
set возраст = 10
say("Меня зовут", имя)
say("Мне", возраст, "лет")`,
                task: "Создай переменную 'город' и выведи её на экран через say()."
            },
            {
                id: 2,
                title: "Математика",
                desc: "Считаем точно",
                theory: "TimLang использует точную математику. 0.1 + 0.2 = 0.3 без ошибок!",
                code: `set a = 0.1
set b = 0.2
set c = a + b
say("0.1 + 0.2 =", c)`,
                task: "Посчитай 0.5 + 0.3 и выведи результат."
            },
            {
                id: 3,
                title: "Функции (fn)",
                desc: "Создаём свои команды",
                theory: "Ключевое слово <b>fn</b> создаёт функцию. Она может принимать параметры.",
                code: `fn greet(name) {
    say("Привет, " + name + "!")
}
greet("Тим")
greet("Ричард")`,
                task: "Добавь вызов greet('Кот') в конце кода."
            },
            {
                id: 4,
                title: "Циклы (loop)",
                desc: "Повторяем действия",
                theory: "Цикл <b>loop</b> выполняет блок кода несколько раз. Например: loop i in 1...5",
                code: `loop счетчик i in 1...5 {
    say("Номер i =", i)
}`,
                task: "Измени диапазон на 1...10 и посмотри, что будет."
            },
            {
                id: 5,
                title: "Условия (if/else)",
                desc: "Принимаем решения",
                theory: "Конструкция <b>if</b> проверяет условие. Если оно верно, выполняет код.",
                code: `set возраст = 18
if возраст >= 18 {
    say("Ты совершеннолетний!")
} else {
    say("Ты ещё юн!")
}`,
                task: "Измени возраст на 16 и запусти."
            }
        ];

        let currentLessonId = 0;

        // ============================
        // 2. ОТРИСОВКА МЕНЮ
        // ============================
        function renderLessons() {
            const list = document.getElementById('lessonList');
            list.innerHTML = '';
            lessons.forEach((l, idx) => {
                const div = document.createElement('div');
                div.className = 'lesson-item' + (idx === currentLessonId ? ' active' : '');
                div.innerHTML = `<b>${l.title}</b><span class="desc">${l.desc}</span>`;
                div.onclick = () => loadLesson(idx);
                list.appendChild(div);
            });
        }

        // ============================
        // 3. ЗАГРУЗКА УРОКА
        // ============================
        function loadLesson(id) {
            currentLessonId = id;
            const lesson = lessons[id];
            
            // Обновляем меню
            renderLessons();
            
            // Обновляем теорию
            document.getElementById('lessonInfo').innerHTML = `
                <h2>Урок ${id+1}: ${lesson.title}</h2>
                <p>${lesson.theory}</p>
                <div class="task">📝 Задание: ${lesson.task}</div>
            `;
            
            // Загружаем код в редактор
            document.getElementById('codeArea').value = lesson.code;
            
            // Очищаем вывод
            clearOutput();
        }

        function prevLesson() {
            if (currentLessonId > 0) loadLesson(currentLessonId - 1);
        }

        function nextLesson() {
            if (currentLessonId < lessons.length - 1) loadLesson(currentLessonId + 1);
        }

        // ============================
        // 4. ИНТЕРПРЕТАТОР (TimLang JS)
        // ============================
        let outputElem = document.getElementById('outputArea');
        
        function print(...args) {
            outputElem.innerText += args.join(" ") + "\n";
        }

        function clearOutput() {
            outputElem.innerText = "⏳ Готов к работе...\n";
        }

        class TimLangJS {
            constructor() {
                this.vars = {};
                this.funcs = {};
            }

            parse(code) {
                let lines = code.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('//'));
                let ast = [];
                let i = 0;
                while (i < lines.length) {
                    let line = lines[i];
                    if (line.startsWith('fn ')) {
                        let match = line.match(/fn\s+(\w+)\(([^)]*)\)\s*\{/);
                        let name = match[1];
                        let params = match[2].split(',').map(p => p.trim()).filter(p => p);
                        let body = [];
                        i++;
                        let depth = 1;
                        while (i < lines.length && depth > 0) {
                            if (lines[i].includes('{')) depth++;
                            if (lines[i].includes('}')) depth--;
                            if (depth > 0) body.push(lines[i]);
                            i++;
                        }
                        this.funcs[name] = { params, body };
                        continue;
                    }
                    ast.push(line);
                    i++;
                }
                return ast;
            }

            evalExpr(expr) {
                expr = expr.trim();
                if (!expr) return "";
                if (expr.startsWith('"') && expr.endsWith('"')) return expr.slice(1, -1);
                if (!isNaN(expr)) return parseFloat(expr);
                if (this.vars[expr] !== undefined) return this.vars[expr];

                let funcMatch = expr.match(/(\w+)\(([^)]*)\)/);
                if (funcMatch && this.funcs[funcMatch[1]]) {
                    let name = funcMatch[1];
                    let args = funcMatch[2].split(',').map(a => this.evalExpr(a.trim()));
                    let oldVars = { ...this.vars };
                    let func = this.funcs[name];
                    func.params.forEach((p, idx) => this.vars[p] = args[idx] || 0);
                    
                    let result = null;
                    for (let line of func.body) {
                        let res = this.execLine(line);
                        if (res && res.return) {
                            result = res.value;
                            break;
                        }
                    }
                    this.vars = oldVars;
                    return result;
                }

                try {
                    if (expr.includes('+')) {
                        let parts = expr.split('+').map(p => this.evalExpr(p.trim()));
                        return parts.reduce((a, b) => a + b, "");
                    }
                    let env = this.vars;
                    let keys = Object.keys(env);
                    let values = keys.map(k => env[k]);
                    let func = new Function(...keys, `return (${expr})`);
                    let result = func(...values);
                    return result;
                } catch { return expr; }
            }

            execLine(line) {
                line = line.trim();
                if (!line) return null;
                
                let sayMatch = line.match(/say\(([^)]*)\)/);
                if (sayMatch) {
                    let args = sayMatch[1].split(',').map(a => this.evalExpr(a.trim()));
                    print(...args);
                    return null;
                }

                let setMatch = line.match(/set\s+(\w+)\s*=\s*(.*)/);
                if (setMatch) {
                    this.vars[setMatch[1]] = this.evalExpr(setMatch[2]);
                    return null;
                }

                let retMatch = line.match(/return\s+(.*)/);
                if (retMatch) {
                    return { return: true, value: this.evalExpr(retMatch[1]) };
                }

                if (line.startsWith('if ')) {
                    let cond = line.slice(3).trim();
                    return { if: this.evalExpr(cond) };
                }

                let loopMatch = line.match(/loop\s+\w+\s+(\w+)\s+in\s+(\d+)\.\.\.(\d+)/);
                if (loopMatch) {
                    return { loop: { var: loopMatch[1], start: parseInt(loopMatch[2]), end: parseInt(loopMatch[3]) } };
                }

                return null;
            }

            execute(code) {
                let lines = this.parse(code);
                let i = 0;
                while (i < lines.length) {
                    let line = lines[i];
                    let result = this.execLine(line);
                    if (result && result.if !== undefined) {
                        let cond = result.if;
                        i++;
                        let trueBlock = [];
                        let depth = 1;
                        while (i < lines.length && depth > 0) {
                            if (lines[i].includes('{')) depth++;
                            if (lines[i].includes('}')) depth--;
                            if (depth > 0) trueBlock.push(lines[i]);
                            i++;
                        }
                        if (cond) {
                            for (let l of trueBlock) this.execLine(l);
                        } else {
                            let foundElse = false;
                            while (i < lines.length && !foundElse) {
                                if (lines[i].trim().startsWith('else')) {
                                    i++;
                                    depth = 1;
                                    let elseBlock = [];
                                    while (i < lines.length && depth > 0) {
                                        if (lines[i].includes('{')) depth++;
                                        if (lines[i].includes('}')) depth--;
                                        if (depth > 0) elseBlock.push(lines[i]);
                                        i++;
                                    }
                                    for (let l of elseBlock) this.execLine(l);
                                    foundElse = true;
                                } else { i++; }
                            }
                        }
                        continue;
                    }
                    if (result && result.loop) {
                        let loopInfo = result.loop;
                        i++;
                        let body = [];
                        let depth = 1;
                        while (i < lines.length && depth > 0) {
                            if (lines[i].includes('{')) depth++;
                            if (lines[i].includes('}')) depth--;
                            if (depth > 0) body.push(lines[i]);
                            i++;
                        }
                        for (let val = loopInfo.start; val <= loopInfo.end; val++) {
                            this.vars[loopInfo.var] = val;
                            for (let l of body) this.execLine(l);
                        }
                        continue;
                    }
                    i++;
                }
            }
        }

        function runCode() {
            clearOutput();
            let code = document.getElementById('codeArea').value;
            let interpreter = new TimLangJS();
            try {
                interpreter.execute(code);
            } catch (e) {
                print("❌ Ошибка выполнения:", e.message);
            }
        }

        // ============================
        // 5. ЗАПУСК
        // ============================
        window.onload = function() {
            loadLesson(0); // Открываем первый урок при загрузке
        };
    </script>
</body>
</html>
